spring.application.name=payment-demo-service
server.port=${SERVER_PORT:8090}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

safeconfig.agent-url=${SAFECONFIG_AGENT_URL:http://localhost:8082}
safeconfig.failure-rate-key=${SAFECONFIG_FAILURE_RATE_KEY:payment.failure_rate}
safeconfig.default-failure-rate=${DEMO_DEFAULT_FAILURE_RATE:0.0}
safeconfig.request-timeout=${SAFECONFIG_REQUEST_TIMEOUT:500ms}
