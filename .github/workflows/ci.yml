name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Test
        run: make test

      - name: Race tests
        run: make race

      - name: Vet
        run: make vet

      - name: Staticcheck
        run: make staticcheck

      - name: Build
        run: make build

      - name: Validate config manifests
        run: make config-validate
