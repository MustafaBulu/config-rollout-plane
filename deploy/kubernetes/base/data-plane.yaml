apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-plane
  namespace: safe-config-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: data-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-plane
    spec:
      containers:
        - name: data-plane
          image: safeconfig/data-plane:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: DATA_PLANE_ADDR
              value: :8081
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
            - name: DATA_PLANE_TENANTS
              value: payments
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: data-plane
  namespace: safe-config-system
spec:
  selector:
    app.kubernetes.io/name: data-plane
  ports:
    - name: http
      port: 8081
      targetPort: http
