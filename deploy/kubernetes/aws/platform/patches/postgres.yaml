apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: safe-config-system
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: safe-config-system
spec:
  resources:
    requests:
      storage: 8Gi

