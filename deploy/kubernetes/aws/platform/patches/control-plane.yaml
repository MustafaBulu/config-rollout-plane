apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: safe-config-system
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: control-plane
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

