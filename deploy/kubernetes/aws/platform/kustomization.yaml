apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: safeconfig/control-plane
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/safeconfig/control-plane
    newTag: latest
  - name: safeconfig/data-plane
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/safeconfig/data-plane
    newTag: latest

patches:
  - path: patches/control-plane.yaml
  - path: patches/data-plane.yaml
  - path: patches/postgres.yaml
  - path: patches/prometheus.yaml

