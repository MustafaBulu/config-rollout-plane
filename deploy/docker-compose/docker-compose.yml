services:
  postgres:
    image: postgres:16-alpine
    container_name: safe-config-postgres
    environment:
      POSTGRES_DB: safe_config
      POSTGRES_USER: safe_config
      POSTGRES_PASSWORD: safe_config
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safe_config -d safe_config"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
